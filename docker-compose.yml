version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: content-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content_planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: content-planner-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./nextjs
      dockerfile: Dockerfile
      target: development
    container_name: content-planner-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/content_planner
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-default-internal-secret-change-me}
      - ENABLE_OPENAI_TOOLS=${ENABLE_OPENAI_TOOLS:-true}
    volumes:
      - ./nextjs:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

  python-agents:
    build:
      context: ./python-agents
      dockerfile: Dockerfile
    container_name: content-planner-python
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/content_planner
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-default-internal-secret-change-me}
      - ENABLE_OPENAI_TOOLS=${ENABLE_OPENAI_TOOLS:-true}
      - USE_DUMMY_AI=${USE_DUMMY_AI:-false}
      - PLANNER_MODEL=${PLANNER_MODEL:-gpt-4}
      - TASK_MANAGER_MODEL=${TASK_MANAGER_MODEL:-gpt-4}
      - CONTEXT_MANAGER_MODEL=${CONTEXT_MANAGER_MODEL:-gpt-4}

    volumes:
      - ./python-agents:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  node_modules:
  next_cache:
