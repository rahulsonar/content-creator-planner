version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: content-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content_planner
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: content-planner-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./nextjs
      dockerfile: Dockerfile
      target: development
    container_name: content-planner-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/content_planner
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-default-internal-secret-change-me}
    volumes:
      - ./nextjs:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  python-agents:
    build:
      context: ./python-agents
      dockerfile: Dockerfile
    container_name: content-planner-python
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/content_planner
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-default-internal-secret-change-me}
      - USE_DUMMY_AI=${USE_DUMMY_AI:-false}
      - PLANNER_AGENT_MODEL=${PLANNER_AGENT_MODEL:-claude-opus-5-5}
      - PLANNER_AGENT_MAX_STEPS=${PLANNER_AGENT_MAX_STEPS:-15}
      - ANTHROPIC_DEFAULT_MODEL=${ANTHROPIC_DEFAULT_MODEL:-claude-opus-5-5}
      - ANTHROPIC_EFFORT=${ANTHROPIC_EFFORT:-medium}
      - ANTHROPIC_MAX_TOKENS=${ANTHROPIC_MAX_TOKENS:-16000}
      - ANTHROPIC_REFUSAL_FALLBACK=${ANTHROPIC_REFUSAL_FALLBACK:-true}

    volumes:
      - ./python-agents:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-log-cleanup:
    image: curlimages/curl:8.11.0
    container_name: content-planner-agent-cleanup
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-600}
      CLEANUP_MAX_AGE_MINUTES: ${CLEANUP_MAX_AGE_MINUTES:-30}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          echo "[agent-log-cleanup] $$(date -u +%FT%TZ) running cleanup (max_age_minutes=$$CLEANUP_MAX_AGE_MINUTES)"
          curl -s -X POST "http://python-agents:8000/api/admin/cleanup-orphaned-agents?max_age_minutes=$$CLEANUP_MAX_AGE_MINUTES" || echo "[agent-log-cleanup] request failed"
          echo ""
          sleep "$$CLEANUP_INTERVAL_SECONDS"
        done
    depends_on:
      - python-agents

  adminer:
    image: adminer:latest
    container_name: content-planner-adminer
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  redis-insight:
    image: redis/redisinsight:latest
    container_name: content-planner-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  redisinsight:
  node_modules:
  next_cache:
